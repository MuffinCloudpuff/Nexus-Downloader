[package]
name = "gd3-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
aes-gcm = "0.10.3"
base64 = "0.22.1"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["ws"] }
futures-util = { version = "0.3.32", features = ["sink"] }
qrcode = "0.14.1"
regex = "1.12.3"
m3u8-rs = "5.0.5"
reqwest = { version = "0.13.4", features = ["stream", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_bencode = "0.2.4"
serde_json = "1.0.150"
sha2 = "0.10.9"
tokio = { version = "1.52.3", features = ["full"] }
tokio-tungstenite = "0.29.0"
tower-http = { version = "0.6.11", features = ["cors"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
tracing-appender = "0.2"
downloader-rs = "0.6.0"
chrono = "0.4.45"
tokio-stream = { version = "0.1.18", features = ["sync"] }
tokio-util = { version = "0.7.18", features = ["rt", "io"] }
getrandom = "0.3.4"
sysinfo = "0.37.2"
dashmap = "6.2.1"
winreg = "0.55.0"
directories = "5.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
image = { version = "0.25", default-features = false, features = ["png"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"
